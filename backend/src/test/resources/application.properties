spring.datasource.url=jdbc:h2:mem:aquaconnect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.jwt.secret=test-secret-key-1234567890
app.jwt.expiration=3600

app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=minioadmin
app.storage.minio.secret-key=minioadmin
app.storage.minio.bucket=aquaconnect-evidence

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.cors.allowed-origins=http://localhost:5173
