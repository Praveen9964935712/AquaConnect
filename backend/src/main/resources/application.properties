spring.application.name=AquaConnect Backend

# Server
server.port=8080

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/aquaconnect
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT authentication
app.jwt.secret=${AQUACONNECT_JWT_SECRET}
app.jwt.expiration=${AQUACONNECT_JWT_EXPIRATION:3600}

# MinIO object storage
app.storage.minio.endpoint=${AQUACONNECT_MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${AQUACONNECT_MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${AQUACONNECT_MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${AQUACONNECT_MINIO_BUCKET:aquaconnect-evidence}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
app.cors.allowed-origins=${AQUACONNECT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
