spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${AQUACONNECT_JWT_SECRET}
app.ivr.trust-token=${AQUACONNECT_IVR_TRUST_TOKEN}

app.storage.minio.endpoint=${AQUACONNECT_MINIO_ENDPOINT}
app.storage.minio.access-key=${AQUACONNECT_MINIO_ACCESS_KEY}
app.storage.minio.secret-key=${AQUACONNECT_MINIO_SECRET_KEY}
app.storage.minio.bucket=${AQUACONNECT_MINIO_BUCKET}

app.cors.allowed-origins=${AQUACONNECT_CORS_ALLOWED_ORIGINS}

management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never